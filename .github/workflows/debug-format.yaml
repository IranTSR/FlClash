name: debug-format

on:
  push:
    branches:
      - link-converter

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Show wanted diff
        run: |
          cp lib/common/proxy_link_converter.dart /tmp/orig.dart
          dart format lib/common/proxy_link_converter.dart
          diff -u /tmp/orig.dart lib/common/proxy_link_converter.dart | head -80 || true
